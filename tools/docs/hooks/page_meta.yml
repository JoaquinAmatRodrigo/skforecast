# Search engine texts of each page, keyed by its path relative to docs/.
# Read by tools/docs/hooks/page_meta.py, which explains how they are used.
#
# - title: the <title> tag, before " - Skforecast Docs". Name what people search
#   for, not the API. Keep it under 43 characters so that the whole tag fits
#   in the 60 characters a search result shows. The short title of `nav` in
#   mkdocs.yml still names the page in the sidebar.
# - description: the meta description and the summary shown when the page is
#   shared. Between 120 and 160 characters, unique, main keyword first,
#   without en or em dashes.

introduction-forecasting/introduction-forecasting.md:
  title: Introduction to time series forecasting
  description: >-
    Introduction to time series forecasting with machine learning: lags,
    recursive and direct strategies, global models and backtesting in Python.

quick-start/quick-start-skforecast.ipynb:
  title: "Quick start: forecasting in Python"
  description: >-
    Quick start to time series forecasting in Python with skforecast: train a
    forecaster, predict, backtest and tune its hyperparameters in a few lines.

user_guides/backtesting.ipynb:
  title: Backtesting time series models in Python
  description: >-
    Backtesting time series models in Python with skforecast: evaluate
    forecasts on past data with or without refit, rolling windows and gaps.

faq/non-negative-predictions.ipynb:
  title: Avoid negative predictions in forecasting
  description: >-
    Avoid negative predictions in time series forecasting with log transforms
    or Poisson and gamma objectives in LightGBM and XGBoost with skforecast.

examples/examples_english.md:
  title: Time series forecasting examples in Python
  description: >-
    Time series forecasting examples in Python: skforecast tutorials with
    gradient boosting, global models, foundation models and prediction intervals.
