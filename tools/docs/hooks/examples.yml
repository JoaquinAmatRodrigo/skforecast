# Single source of truth for the docs Examples pages.
#
# The card grids on docs/examples/examples_english.md, examples_spanish.md and
# examples_chinese.md are generated from this file at build time by the mkdocs
# hook tools/docs/hooks/examples_grid.py. Never edit the generated grids in the
# Markdown pages: edit this file instead.
#
# To add a tutorial:
#   1. Add an entry to `examples` with a unique `id`, next to the others of its
#      section (cards keep the order of this file).
#   2. Pick a `section` from `sections` and a `level` from `levels` (the cards of
#      a `featured` section have no level).
#   3. Add a `title`, `summary` and `url` under `en` (required).
#   4. Add a block for each language it is translated into. The other language
#      pages show the English card with an "In English" tag. A translated block
#      without `url` keeps its title and summary, links to the English article
#      and also gets the tag.
#
# The build fails on a duplicate id, an unknown section or level, or a missing
# title, summary or url.

levels:
  - beginner
  - intermediate
  - advanced

# ---------------------------------------------------------------------------
# Languages. `page` is the file name inside docs/examples/, `label` is the text
# used in the language switcher shown at the top of every examples page. `en`
# is required: it is the fallback of the other languages.
# ---------------------------------------------------------------------------
languages:
  en:
    page: examples_english.md
    label: English
  es:
    page: examples_spanish.md
    label: Español
  zh:
    page: examples_chinese.md
    label: 中文

# ---------------------------------------------------------------------------
# Localised card tags: one label per level and the tag of the cards that link
# to an article in English.
# ---------------------------------------------------------------------------
ui:
  en:
    levels:
      beginner: Beginner
      intermediate: Intermediate
      advanced: Advanced
  es:
    in_english: En inglés
    levels:
      beginner: Principiante
      intermediate: Intermedio
      advanced: Avanzado
  zh:
    in_english: 英文
    levels:
      beginner: 入门
      intermediate: 进阶
      advanced: 高级

# ---------------------------------------------------------------------------
# Sections, rendered in this order. `icon` is a shortcode from
# https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/ shown in
# the section heading.
# `featured: true` highlights the cards of the section, for
# the other products of the skforecast team.
# ---------------------------------------------------------------------------
sections:
  - id: ecosystem
    icon: material-robot-outline
    featured: true
    en: Skforecast ecosystem
    es: Ecosistema skforecast
    zh: Skforecast 生态

  - id: ml-forecasting
    icon: material-chart-line
    en: Machine learning forecasting
    es: Forecasting con machine learning
    zh: 机器学习预测

  - id: global-models
    icon: material-chart-multiple
    en: "Global models: multi-series forecasting"
    es: "Modelos globales: forecasting multi-serie"
    zh: 全局模型：多序列预测

  - id: foundation-deep-learning
    icon: material-chip
    en: Foundation models and deep learning
    es: Modelos fundacionales y deep learning
    zh: 基础模型与深度学习

  - id: statistical-models
    icon: material-chart-bell-curve
    en: Statistical models
    es: Modelos estadísticos
    zh: 统计模型

  - id: probabilistic
    icon: material-chart-bell-curve-cumulative
    en: Probabilistic forecasting
    es: Forecasting probabilístico
    zh: 概率预测

  - id: data-monitoring
    icon: material-magnify
    en: Data exploration, quality and monitoring
    es: Exploración, calidad de datos y monitorización
    zh: 数据探索、数据质量与监控

  - id: case-studies
    icon: material-lightbulb-on
    en: Real-world case studies
    es: Casos prácticos reales
    zh: 真实案例研究

  - id: performance
    icon: material-speedometer
    en: Performance
    es: Rendimiento
    zh: 性能优化

